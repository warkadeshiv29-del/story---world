<script>
function searchStories() {
  let input = document.getElementById("searchInput").value.toLowerCase();
  let cards = document.querySelectorAll(".card");

  cards.forEach(function(card) {
    let text = card.innerText.toLowerCase();

    if (text.includes(input)) {
      card.style.display = "";
    } else {
      card.style.display = "none";
    }
  });
}
</script>
<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "https://ntnfvikaftnaydemlrrf.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_ROFxsmUEMvFtc-JJxRYT1g_bwvW4L_l";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  async function loadPublishedStories() {

    const { data, error } = await supabaseClient
      .from("stories")
      .select("*")
      .eq("published", true)
      .order("created_at", { ascending: false });

    if (error) {
      console.error("Stories load error:", error);
      return;
    }

    if (!data || data.length === 0) return;

    const section = document.createElement("section");

    section.innerHTML = `
      <h2 style="
        text-align:center;
        margin:35px 0 20px;
      ">
        📚 नई कहानियाँ
      </h2>

      <div id="supabaseStories" style="
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
        gap:20px;
        padding:20px;
      "></div>
    `;

    document.body.appendChild(section);

    const container =
      document.getElementById("supabaseStories");

    data.forEach(story => {

      const card = document.createElement("div");

      card.style.cssText = `
        background:#fff;
        border-radius:15px;
        overflow:hidden;
        box-shadow:0 5px 20px rgba(0,0,0,0.10);
        padding-bottom:18px;
      `;

      card.innerHTML = `

        ${
          story.image_url
          ? `<img
              src="${story.image_url}"
              alt="${story.title}"
              style="
                width:100%;
                height:180px;
                object-fit:cover;
              "
            >`
          : ""
        }

        <div style="padding:15px">

          <small>
            ${story.category}
          </small>

          <h3>
            ${story.title}
          </h3>

          <p>
            ${story.content.substring(0, 150)}...
          </p>

          <a
            href="story.html?slug=${encodeURIComponent(story.slug)}"
            style="
              display:inline-block;
              padding:10px 16px;
              background:#111;
              color:white;
              text-decoration:none;
              border-radius:8px;
            "
          >
            पढ़ें
          </a>

        </div>
      `;

      container.appendChild(card);
    });
  }

  loadPublishedStories();
           </script>
