    <div class="card">
    <section id="stories">
  <h2>📚 Latest Stories</h2>

<script>
function searchStories() {
  let input = document.getElementById("searchInput").value.toLowerCase();
  let cards = document.querySelectorAll(".card");

  cards.forEach(function(card) {
    let text = card.innerText.toLowerCase();

    if (text.includes(input)) {
      card.style.display = "";
    } else {
      card.style.display = "none";
    }
  });
}
</script>
<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "https://ntnfvikaftnaydemlrrf.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_ROFxsmUEMvFtc-JJxRYT1g_bwvW4L_l";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );
async function loadPublishedStories() {
  const { data, error } =
    await supabaseClient
      .from("stories")
      .select("*")
      .eq("published", true)
      .order("created_at", { ascending: false });

  if (error) {
    console.error("Stories load error:", error);
     alert("Stories load error: " + error.message);
    return;
  }

  const container =
    document.getElementById("dynamicStories");

  if (!container) return;

  container.innerHTML = "";

  if (!data || data.length === 0) {
    container.innerHTML =
      "<p>अभी कोई नई कहानी उपलब्ध नहीं है।</p>";
    return;
  }

  data.forEach(story => {

    const card =
      document.createElement("div");

    card.className = "card";

    card.innerHTML = `

      ${
        story.image_url
        ? `<img
            src="${story.image_url}"
            alt="${story.title}"
            style="
              width:100%;
              height:180px;
              object-fit:cover;
            "
          >`
        : `<div class="card-image">📖</div>`
      }

      <div class="card-content">

        <small>
          ${story.category || ""}
        </small>

        <h3>${story.title}</h3>

        <p>
          ${
            story.content
              ? story.content.substring(0, 150) + "..."
              : ""
          }
        </p>

        <a
          href="story.html?slug=${encodeURIComponent(story.slug)}"
          class="button"
        >
          पढ़ें
        </a>

      </div>
    `;

    container.appendChild(card);
  });
}

loadPublishedStories();
</script>
