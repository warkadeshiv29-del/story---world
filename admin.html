<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Story World Admin Panel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    .container {
      width: 92%;
      max-width: 700px;
      margin: 40px auto;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    h1, h2 {
      text-align: center;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      margin: 8px 0 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 250px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .logout {
      background: #c62828;
      margin-top: 10px;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    #adminPanel {
      display: none;
    }

    label {
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div class="box" id="loginBox">

    <h1>🔐 Story World</h1>
    <h2>Admin Login</h2>

    <label>Email</label>
    <input
      type="email"
      id="email"
      placeholder="Admin email"
    >

    <label>Password</label>
    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button onclick="login()">Login</button>

    <div class="message" id="loginMessage"></div>

  </div>


  <!-- ADMIN PANEL -->
  <div class="box" id="adminPanel">

    <h1>📚 Story Admin Panel</h1>

    <h2>नई कहानी जोड़ें</h2>

    <label>कहानी का Title</label>
    <input
      type="text"
      id="title"
      placeholder="जैसे: रहस्यमयी जंगल"
    >

    <label>Slug</label>
    <input
      type="text"
      id="slug"
      placeholder="jaise: rahasyamayi-jungle"
    >

    <label>Category</label>
    <select id="category">
      <option value="Horror">Horror</option>
      <option value="Mystery">Mystery</option>
      <option value="Moral">Moral</option>
    </select>

    <label>Image URL</label>
    <input
      type="text"
      id="image_url"
      placeholder="Image URL"
    >

    <label>पूरी कहानी</label>
    <textarea
      id="content"
      placeholder="यहाँ पूरी कहानी लिखें..."
    ></textarea>

    <label>
      <input
        type="checkbox"
        id="published"
        style="width:auto;"
      >
      कहानी Publish करें
    </label>

    <br><br>

    <button onclick="publishStory()">
      🚀 Publish Story
    </button>

    <div class="message" id="storyMessage"></div>

    <button class="logout" onclick="logout()">
      Logout
    </button>

  </div>

</div>


<script>

  // ==========================================
  // SUPABASE SETTINGS
  // ==========================================

  const SUPABASE_URL = "https://ntnfvikaftnaydemlrrf.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_ROFxsmUEMvFtc-JJxRYT1g_bwvW4L_l";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


  // ==========================================
  // LOGIN
  // ==========================================

  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const message =
      document.getElementById("loginMessage");

    if (!email || !password) {
      message.textContent =
        "Email और password दोनों भरें।";
      return;
    }

    message.textContent = "Login हो रहा है...";

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {

      message.textContent =
        "Login failed: " + error.message;

      return;
    }

    document.getElementById("loginBox").style.display =
      "none";

    document.getElementById("adminPanel").style.display =
      "block";
  }


  // ==========================================
  // PUBLISH STORY
  // ==========================================

  async function publishStory() {

    const title =
      document.getElementById("title").value.trim();

    const slug =
      document.getElementById("slug").value.trim();

    const category =
      document.getElementById("category").value;

    const image_url =
      document.getElementById("image_url").value.trim();

    const content =
      document.getElementById("content").value.trim();

    const published =
      document.getElementById("published").checked;

    const message =
      document.getElementById("storyMessage");


    if (!title || !slug || !content) {

      message.textContent =
        "Title, Slug और पूरी कहानी भरना जरूरी है।";

      return;
    }


    message.textContent =
      "Story publish हो रही है...";


    const { data, error } =
      await supabaseClient
        .from("stories")
        .insert([
          {
            title: title,
            slug: slug,
            category: category,
            image_url: image_url,
            content: content,
            published: published
          }
        ])
        .select();


    if (error) {

      message.textContent =
        "Error: " + error.message;

      return;
    }


    message.textContent =
      "✅ Story successfully save हो गई!";


    document.getElementById("title").value = "";
    document.getElementById("slug").value = "";
    document.getElementById("image_url").value = "";
    document.getElementById("content").value = "";
    document.getElementById("published").checked = false;
  }


  // ==========================================
  // LOGOUT
  // ==========================================

  async function logout() {

    await supabaseClient.auth.signOut();

    document.getElementById("adminPanel").style.display =
      "none";

    document.getElementById("loginBox").style.display =
      "block";

    document.getElementById("loginMessage").textContent =
      "Logout हो गया।";
  }

</script>

</body>
</html>
