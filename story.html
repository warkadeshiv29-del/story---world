/* ===== Story Page Professional Design ===== */

body {
  margin: 0;
  background: #f5f6fa;
  color: #222;
  font-family: "Noto Sans Devanagari", "Mangal", Arial, sans-serif;
  line-height: 1.9;
}

header {
  background: linear-gradient(135deg, #111827, #312e81);
  color: white;
  text-align: center;
  padding: 28px 15px;
  border-radius: 0 0 22px 22px;
  box-shadow: 0 4px 15px rgba(0,0,0,.12);
}

header h2 {
  margin: 0;
  font-size: 30px;
}

header p {
  margin: 5px 0 0;
  opacity: .9;
}

#storyContainer {
  max-width: 850px;
  margin: 30px auto;
  padding: 0 16px 50px;
}

.story-page {
  background: white;
  border-radius: 18px;
  padding: 28px;
  box-shadow: 0 6px 25px rgba(0,0,0,.08);
}

.story-page h1 {
  font-size: 32px;
  line-height: 1.4;
  margin: 0 0 12px;
  color: #222;
}

.story-category {
  display: inline-block;
  background: #ede9fe;
  color: #4c1d95;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 20px;
}

.story-image {
  width: 100%;
  max-height: 450px;
  object-fit: cover;
  border-radius: 14px;
  margin-bottom: 25px;
}

.story-content p {
  margin: 0 0 18px;
  font-size: 17px;
}

.story-content strong {
  color: #312e81;
}

.story-dialogue {
  background: #f3f4f6;
  border-left: 4px solid #312e81;
  padding: 12px 16px;
  margin: 18px 0;
  border-radius: 8px;
}

@media (max-width: 600px) {
  #storyContainer {
    margin: 18px auto;
    padding: 0 10px 35px;
  }

  .story-page {
    padding: 20px 16px;
    border-radius: 14px;
  }

  .story-page h1 {
    font-size: 25px;
  }

  .story-content p {
    font-size: 16px;
    line-height: 1.8;
  }

  .story-image {
    max-height: 300px;
  }
}
.error{
  text-align:center;
  padding:40px;
  font-size:20px;
}
</style>
</head>

<body>

<header>
  <h2>📖 Story World</h2>
  <p>हर कहानी, एक नई दुनिया</p>
</header>

<div id="storyContainer">
  <div class="error">कहानी लोड हो रही है...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://ntnfvikaftnaydemlrrf.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_ROFxsmUEMvFtc-JJxRYT1g_bwvW4L_l";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

async function loadStory(){

  const params = new URLSearchParams(window.location.search);
  const slug = params.get("slug");

  const container = document.getElementById("storyContainer");

  if(!slug){
    container.innerHTML = `
      <div class="error">
        ❌ कहानी नहीं मिली।
      </div>
    `;
    return;
  }

  const { data, error } = await supabaseClient
    .from("stories")
    .select("*")
    .eq("slug", slug)
    .eq("published", true)
    .single();

  if(error || !data){

    console.error(error);

    container.innerHTML = `
      <div class="error">
        ❌ कहानी लोड नहीं हो सकी।
        <br><br>
        <a class="back" href="index.html">← वापस जाएँ</a>
      </div>
    `;

    return;
  }

  container.innerHTML = `

    <article class="story-box">

      ${
        data.image_url
        ? `<img src="${data.image_url}" alt="${data.title}">`
        : ""
      }

      <div class="category">
        ${data.category || "कहानी"}
      </div>

      <h1>${data.title}</h1>

      <div class="content">
        ${data.content}
      </div>

      <a class="back" href="index.html">
        ← वापस जाएँ
      </a>

    </article>

  `;
}

loadStory();

</script>

</body>
</html>
